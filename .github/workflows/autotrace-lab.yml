name: autotrace-lab
on:
  workflow_dispatch:
  push:
    paths: ["tools/autotrace_lab/**", ".github/workflows/autotrace-lab.yml"]
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Tools
        run: |
          # autotrace was dropped from Ubuntu 22.04+: build from source (PNG in, SVG out only)
          sudo apt-get update && sudo apt-get install -y gettext autopoint autoconf automake libtool intltool pkg-config libglib2.0-dev libpng-dev
          git clone --depth 1 --branch 0.31.10 https://github.com/autotrace/autotrace /tmp/at || git clone --depth 1 https://github.com/autotrace/autotrace /tmp/at
          (cd /tmp/at && ./autogen.sh && ./configure --without-magick --without-pstoedit --without-swf --without-emf --without-ming --without-libwmf && make -j4 && sudo make install && sudo ldconfig)
          autotrace --version
          pip install numpy scipy scikit-image opencv-python-headless
          curl -fL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp
      - name: Compile the unmodified app vectorizer (+ stub Stroke/BrushType) for the JVM
        run: |
          /tmp/kotlinc/bin/kotlinc -include-runtime -d /tmp/h.jar tools/autotrace_lab/kt/Stubs.kt tools/autotrace_lab/kt/Main.kt app/src/main/java/com/smitnk/sketcher/image/pipeline/LineArtVectorizer.kt
      - name: Fetch AI ink maps from ci-results
        run: |
          # newest ci-results commit that still has the AI ink dumps (later runs may not)
          git fetch origin ci-results --depth 200
          for c in $(git rev-list FETCH_HEAD); do
            if git ls-tree -r --name-only $c | grep -q 'ink_raw.png'; then break; fi
          done
          echo "using ci-results commit $c"
          git worktree add /tmp/ci $c
      - run: python tools/autotrace_lab/run.py /tmp/ci/latest/debug /tmp/h.jar /tmp/out
      - name: Publish
        run: |
          set -e
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch origin models-lab --depth 1 && git checkout -B lab FETCH_HEAD
          rm -rf autotrace; mkdir -p autotrace
          cp -r /tmp/out/sheets /tmp/out/autotrace.json /tmp/out/autotrace.md autotrace/
          git add autotrace && git commit -m "autotrace lab results" && git push origin HEAD:models-lab
