name: model-lab
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/model_lab/**"
      - ".github/workflows/model-lab.yml"
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime onnxconverter-common pillow numpy opencv-python-headless
      - name: Convert
        run: python tools/model_lab/convert.py
      - name: Evaluate
        run: python tools/model_lab/evaluate.py app/src/debug/assets/testimages out out
      - name: Variants (int8 dynamic, ORT format, quality + timing vs fp32)
        run: python tools/model_lab/variants.py app/src/debug/assets/testimages out out
      - name: Export TEED + MTEED (tiny edge detectors, ~250 KB each)
        run: |
          set -e
          git clone --depth 1 https://github.com/xavysp/TEED.git /tmp/TEED
          mkdir -p weights
          curl -fL -o weights/MTEED.pth https://huggingface.co/TheMistoAI/MistoLine/resolve/main/Anyline/MTEED.pth
          # TEED (MIT): BIPED epoch 5 = repo default checkpoint; BGR mean subtraction baked into the graph, fused head
          python tools/model_lab/export_teed.py --ted-dir /tmp/TEED --weights /tmp/TEED/checkpoints/BIPED/5/5_model.pth --out out/teed.onnx --mean bgr --mode fused
          # MTEED (OpenRAIL++, TheMistoAI/MistoLine): no mean subtraction, sigmoid of mean logits (controlnet_aux TEEDdetector)
          python tools/model_lab/export_teed.py --ted-dir /tmp/TEED --weights weights/MTEED.pth --out out/mteed.onnx --mean none --mode avglogit
      - name: Publish
        run: |
          set -e
          mkdir -p pub/sheets
          cp -r out/sheets/. pub/sheets/
          cp out/timings.csv out/sizes.txt pub/
          # variants: verdict json + sheets always; weights only if the quality gate passed AND < 95 MB (branch rule)
          mkdir -p pub/variants/sheets
          cp out/variants/variants.json pub/variants/
          cp -r out/variants/sheets/. pub/variants/sheets/
          python - <<'PY'
          import json, os, shutil
          v = json.load(open("out/variants/variants.json"))
          for f, r in v.items():
              if r.get("verdict") == "pass" and r.get("mb", 1e9) < 95 and r["kind"] != "fp32":
                  shutil.copy(os.path.join("out/variants", f), "pub/variants/")
          PY
          for f in out/variants/*.onnx out/variants/*.ort; do
            [ -f "$f" ] && gh release upload models-v1 "$f" --repo "$GITHUB_REPOSITORY" --clobber || true
          done
          gh release create models-v1 --repo "$GITHUB_REPOSITORY" --title "Line-art ONNX models" --notes "Converted ControlNet Annotators line-art models (see tools/model_lab/LICENSES.md)" || true
          for f in out/*.onnx; do
            sz=$(stat -c %s "$f")
            if [ "$sz" -lt $((95*1024*1024)) ]; then cp "$f" pub/; fi
            gh release upload models-v1 "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          cd pub
          git init -q -b models-lab
          git config user.name "model-lab"; git config user.email "model-lab@users.noreply.github.com"
          git add -A
          git commit -qm "model-lab outputs"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" models-lab
      - uses: actions/upload-artifact@v4
        with:
          name: model-lab-out
          path: out/
