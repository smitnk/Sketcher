name: a2s-lab
on:
  workflow_dispatch:
  push:
    paths: ["tools/a2s_lab/**", ".github/workflows/a2s-lab.yml"]
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxscript onnxruntime onnxconverter-common pillow numpy
          git clone --depth 1 https://github.com/Mukosame/Anime2Sketch.git /tmp/A2S
          mkdir -p /tmp/A2S/weights
          curl -fL -o /tmp/A2S/weights/netG.pth https://huggingface.co/gyrojeff/Anime2Sketch/resolve/main/netG.pth
          curl -fL -o /tmp/A2S/weights/improved.bin https://huggingface.co/gyrojeff/Anime2Sketch/resolve/main/improved.bin
      - run: python tools/a2s_lab/run.py
      - name: Publish
        run: |
          set -e
          for f in out_a2s/*_fp16.onnx; do gh release upload models-v1 "$f" --repo "$GITHUB_REPOSITORY" --clobber || true; done
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch origin models-lab --depth 1 && git checkout -B lab FETCH_HEAD
          mkdir -p a2s && cp out_a2s/a2s_sheet.jpg out_a2s/a2s.json a2s/
          git add a2s && git commit -m "a2s lab results" && git push origin HEAD:models-lab
