name: Android CI

on:
  push:
    branches-ignore: [ci-results]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build debug APK and run unit tests
        run: |
          set -o pipefail
          mkdir -p out
          gradle assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee out/build.log
      - name: Collect reports
        if: always()
        run: |
          mkdir -p out
          tail -n 300 out/build.log > out/build-tail.log || true
          grep -E "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)" out/build.log > out/errors.txt || true
          cp -r app/build/test-results out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-out, path: out }
      - uses: actions/upload-artifact@v4
        with:
          name: Sketcher-debug
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Sketcher-debug, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/emu.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator-out, path: emu }

  publish:
    needs: [build, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: arts }
      - name: Push results to ci-results branch
        run: |
          git config --global user.name "sketcher-ci"
          git config --global user.email "ci@users.noreply.github.com"
          git clone --depth 1 --branch ci-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" res 2>/dev/null || { git init res; cd res; git checkout -b ci-results; git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; cd ..; }
          cd res
          git rm -rq . 2>/dev/null || true
          mkdir -p latest
          cp -r ../arts/build-out/* latest/ 2>/dev/null || true
          rm -f latest/*.apk
          cp -r ../arts/emulator-out/* latest/ 2>/dev/null || true
          cat > latest/SUMMARY.md <<EOS
          commit: ${{ github.sha }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          build: ${{ needs.build.result }}
          emulator: ${{ needs.emulator.result }}
          EOS
          git add -A
          git commit -qm "results for ${{ github.sha }}" || true
          git push -q origin ci-results
